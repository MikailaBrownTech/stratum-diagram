<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stratum: architecture explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9eef5; --card: #f6f8fb; --ink: #14213d; --muted: #5a6b86;
    --panel: rgba(255,255,255,0.84); --line: rgba(20,33,61,0.16); --chip: rgba(20,33,61,0.06);
    --accent: #2f6bff; --fail: #ff3b3b; --down: #ff8a1f; --deg: #ffd02e; --ok: #2fb36b;
    --dock: 62px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220; --card: #111b2f; --ink: #e7edf8; --muted: #92a1bd;
      --panel: rgba(17,26,45,0.86); --line: rgba(231,237,248,0.17); --chip: rgba(231,237,248,0.08); --accent: #7fb0ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --card: #111b2f; --ink: #e7edf8; --muted: #92a1bd;
    --panel: rgba(17,26,45,0.86); --line: rgba(231,237,248,0.17); --chip: rgba(231,237,248,0.08); --accent: #7fb0ff;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { height: 100%; font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  [hidden] { display: none !important; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* header */
  .top { position: fixed; z-index: 4; left: 0; right: 0; top: env(safe-area-inset-top, 0px); padding: 12px 14px 0; pointer-events: none; display: flex; flex-direction: column; gap: 8px; }
  .top > * { pointer-events: auto; }
  .brand { pointer-events: none; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: clamp(26px, 6vw, 38px); font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
  .brand p { margin: 0; font-size: 13px; color: var(--muted); }
  .scroller { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 1px 0; }
  .scroller::-webkit-scrollbar { display: none; }
  .tool, .chip, .btn {
    flex: none; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; cursor: pointer;
    padding: 8px 13px; font-size: 13px; font-weight: 600;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background .2s, color .2s, opacity .2s;
  }
  .tool[aria-pressed="true"], .tool[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; }
  .chip i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); display: block; }
  .chip[aria-pressed="false"] { opacity: 0.45; }
  .chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
  .btn { border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.danger { color: var(--fail); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.on { background: var(--fail); color: #fff; border-color: var(--fail); }
  :is(.tool, .chip, .btn, .row, .close, .tab, .card-btn, .dockb):focus-visible, :is(input, select, textarea):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .searchbar { position: relative; max-width: 420px; }
  input, select, textarea { width: 100%; box-sizing: border-box; font-size: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  textarea { resize: vertical; min-height: 90px; line-height: 1.4; }
  .qres { margin-top: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow: hidden; }
  .qres:empty { display: none; }

  /* dock + hint */
  .dock {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    display: flex; gap: 2px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .dockb { border: 0; background: transparent; border-radius: 999px; padding: 11px 13px; font-size: 14px; font-weight: 600; cursor: pointer; min-width: 56px; }
  .dockb[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .hint {
    white-space: normal; border-radius: 16px !important;
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: max-content; max-width: calc(100% - 32px);
    font-size: 13px; color: var(--muted); text-align: center; pointer-events: none; transition: opacity .3s;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  body.panel-open .hint { opacity: 0; }
  .key { position: fixed; z-index: 3; left: 12px; flex-wrap: wrap; max-width: 60vw; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; gap: 10px; font-size: 11px; color: var(--muted); pointer-events: none; transition: opacity .3s; }
  .key i { display: inline-block; width: 9px; height: 9px; margin-right: 4px; vertical-align: middle; box-sizing: border-box; }
  .key .k-req { border-radius: 50%; background: var(--accent); }
  .key .k-resp { border-radius: 50%; border: 2px solid #2fb36b; }
  .key .k-evt { background: #f5a524; transform: rotate(45deg) scale(0.85); }
  .key .k-dat { background: #a24bff; transform: rotate(45deg) scale(0.85); }
  body.panel-open .key { opacity: 0; }
  .zoomctl { position: fixed; z-index: 4; right: 12px; top: 44%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
  .zoomctl button { width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 20px; font-weight: 600; cursor: pointer; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .zoomctl #cPan { font-size: 12px; }
  .zoomctl button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .zoomctl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (min-width: 860px) { body.panel-open .zoomctl { right: 392px; } }
  .note.scen { background: var(--chip); border-radius: 10px; padding: 8px 10px; color: var(--ink); }

  /* panel */
  .panel {
    position: fixed; z-index: 5; left: 10px; right: 10px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    max-height: 46vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.18); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    transform: translateY(calc(100% + 90px)); transition: transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .panel.open { transform: none; }
  .panel.min > :not(.p-head) { display: none; }
  .panel.min { padding-bottom: 8px; }
  @media (min-width: 860px) {
    .panel { left: auto; right: 16px; width: 360px; max-height: none; top: calc(env(safe-area-inset-top, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(calc(100% + 40px)); }
    .panel.min { top: auto; }
    .top { padding-right: 396px; }
    .scroller.wrap { flex-wrap: wrap; overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) { .panel, .hint, .tool, .chip, .btn { transition: none; } }

  .p-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; position: sticky; top: -14px; margin: -14px -16px 0; padding: 14px 16px 6px; background: linear-gradient(var(--panel) 80%, transparent); z-index: 1; }
  .p-head h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .p-btns { display: flex; gap: 6px; flex: none; }
  .close { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 1px solid var(--line); background: var(--chip); font-size: 16px; line-height: 1; padding: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); }
  .tag i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); display: block; }
  .p-desc { margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
  .meta { margin: 10px 0 0; font-size: 13px; line-height: 1.55; }
  .meta b { font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 0; }
  .stat { background: var(--chip); border-radius: 12px; padding: 9px 10px; }
  .stat strong { display: block; font-size: 15px; font-weight: 600; }
  .stat span { font-size: 12px; color: var(--muted); }
  .sec { margin: 16px 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; text-align: left; cursor: pointer; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 10px 2px; font-size: 14px; }
  .row b { font-weight: 600; }
  .row span { font-size: 12px; color: var(--muted); text-align: right; }
  .row.sel { background: var(--chip); border-radius: 10px; }
  .none, .note { font-size: 13px; color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .btnrow .btn { flex: 1 1 auto; }
  .impact { margin: 12px 0 0; border-radius: 14px; padding: 12px; background: rgba(255,59,59,0.1); border: 1px solid rgba(255,59,59,0.35); font-size: 14px; line-height: 1.45; }
  .impact p { margin: 0 0 8px; }
  .impact p:last-child { margin: 0; }
  .pills { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 8px; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; color: #1a1205; }
  .pill.down { background: var(--down); } .pill.deg { background: var(--deg); } .pill.fail { background: var(--fail); color: #fff; }
  label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 0; }
  label.f > :not(span) { margin-top: 4px; font-weight: 400; color: var(--ink); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .find { display: block; width: 100%; text-align: left; cursor: pointer; background: var(--chip); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; margin: 8px 0 0; font-size: 14px; line-height: 1.4; }
  .find b { display: block; font-weight: 600; margin-bottom: 2px; }
  .find span { color: var(--muted); font-size: 13px; }
  .sev { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: var(--c); }
  .path { display: block; width: 100%; text-align: left; cursor: pointer; background: var(--chip); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 8px 0 0; font-size: 13px; line-height: 1.45; }
  .path[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .path b { font-size: 14px; font-weight: 600; display: block; }
  .erow { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; font-size: 13px; }
  .erow select { grid-column: 1; }

  /* modal */
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(5,10,25,0.55); display: flex; align-items: flex-end; justify-content: center; }
  .card { background: var(--card); width: 100%; max-width: 700px; max-height: 88vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; border: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .mh { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 8px; }
  .mh h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .mb { padding: 4px 18px 18px; overflow-y: auto; overscroll-behavior: contain; }
  @media (min-width: 860px) { .modal { align-items: center; padding: 24px; } .card { border-radius: 20px; } }
  .tabs { display: flex; gap: 6px; margin: 4px 0 12px; flex-wrap: wrap; }
  .msg { font-size: 13px; margin: 10px 0 0; line-height: 1.45; min-height: 18px; }
  .msg.err { color: var(--fail); }
  .msg.good { color: var(--ok); }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .samples .btn { padding: 7px 11px; font-size: 13px; }
  .lg { margin: 14px 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  img.snap { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }
  code { font-size: 12px; background: var(--chip); padding: 1px 5px; border-radius: 5px; }
  select.tool { width: auto; font-size: 13px; padding: 8px 12px; background: var(--chip); border-radius: 999px; font-weight: 600; cursor: pointer; }
  .grow { display: grid; grid-template-columns: 38px 1fr 32px 32px 32px; gap: 6px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; }
  .grow input[type="color"] { width: 38px; height: 36px; padding: 2px; border-radius: 8px; cursor: pointer; }
  .close:disabled { opacity: 0.3; cursor: default; }
  details summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  /* professional polish */
  ::selection { background: rgba(47,107,255,0.28); }
  .brand { align-items: center; gap: 10px; flex-wrap: nowrap; }
  .brand .logo { width: 28px; height: 28px; color: var(--ink); flex: none; }
  .brand h1 { flex: none; }
  .brand .doc { pointer-events: auto; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 3px 6px; border-radius: 8px; cursor: pointer; min-width: 0; max-width: 56vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .brand .doc:hover { background: var(--chip); color: var(--ink); }
  .tool:hover, .btn:hover:not(:disabled) { border-color: var(--ink); }
  .btn { transition: border-color .15s, background .15s; }
  .vrow { border-top: 1px solid var(--line); padding: 10px 0; }
  .vrow > b { display: block; font-size: 14px; }
  .vmeta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .vdiff .note { margin: 6px 0 0; }
  .tour { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  .tour-spot { position: fixed; display: none; border-radius: 14px; border: 2px solid var(--accent); box-shadow: 0 0 0 100vmax rgba(8,14,28,0.58); transition: all .25s ease; pointer-events: none; }
  .tour-card { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); width: min(380px, calc(100% - 28px)); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: 0 18px 50px rgba(0,0,0,0.35); pointer-events: auto; }
  .tour-card h3 { margin: 3px 0 6px; font-size: 17px; letter-spacing: -0.01em; }
  .tour-card p { margin: 0 0 14px; font-size: 14px; line-height: 1.5; color: var(--muted); }
  .tour-step { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .tour-btns { display: flex; gap: 8px; align-items: center; }
  @media (prefers-reduced-motion: reduce) { .tour-spot { transition: none; } }
  .stepb { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--chip); border-radius: 10px; padding: 8px 10px; margin: 6px 0; cursor: pointer; font-size: 13px; }
  .stepb b { display: block; font-size: 13px; }
  .stepb small { display: block; color: var(--muted); margin-top: 2px; font-size: 12px; }
  .stepb.on { border-color: var(--accent); background: var(--card); box-shadow: inset 0 0 0 1px var(--accent); }
  .chb.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="3D architecture diagram. The Components list offers a keyboard friendly alternative."></canvas>

<header class="top">
  <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5l12 6.5-12 6.5L4 10z" fill="#2f6bff"/><path d="M4 15.5l12 6.5 12-6.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/><path d="M4 21l12 6.5L28 21" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" opacity=".5"/></svg><h1>Stratum</h1><button class="doc" id="sub" type="button" title="Rename this architecture"></button></div>
  <div class="scroller wrap" id="tools" role="toolbar" aria-label="Tools">
    <button class="tool" id="tTemplates" type="button">Templates</button>
    <button class="tool" id="tSearch" type="button" aria-pressed="false">Search</button>
    <button class="tool" id="tOwn" type="button">Your own</button>
    <button class="tool" id="tMore" type="button">More</button>
  </div>
  <div id="toolsHidden" hidden>
    <button id="tEdgeLbl" type="button" aria-pressed="false">Connection labels</button>
    <button id="tText" type="button">Text size</button>
    <button id="tFit" type="button">Fit</button>
    <button id="tList" type="button">Components</button>
    <button id="tTour" type="button">Walkthrough</button>
    <button id="tSpread" type="button" aria-pressed="true">Spread</button>
    <button id="tFlow" type="button" aria-pressed="true">Flow</button>
    <button id="tReset" type="button">Reset view</button>
  </div>
  <div class="scroller wrap" id="legend" role="group" aria-label="Show or hide groups" hidden></div>
  <div class="searchbar" id="searchbar" hidden>
    <input id="q" type="search" placeholder="Search name, team, stack or zone" autocomplete="off" aria-label="Search components">
    <div class="qres" id="qres"></div>
  </div>
</header>

<div class="zoomctl" id="zoomctl" role="group" aria-label="Camera controls">
  <button id="cPan" type="button" aria-pressed="false" aria-label="Move mode: drag to slide the view">Move</button>
  <button id="cIn" type="button" aria-label="Zoom in">+</button>
  <button id="cOut" type="button" aria-label="Zoom out">&minus;</button>
</div>
<div class="key" id="key" aria-hidden="true"><span><i class="k-req"></i>request</span><span><i class="k-resp"></i>response</span><span><i class="k-evt"></i>event</span><span><i class="k-dat"></i>batch</span></div>
<div class="hint" id="hint"></div>
<aside class="panel" id="panel" aria-label="Details"></aside>

<div class="modal" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="card">
    <div class="mh"><h2 id="dlgTitle"></h2><button class="close" id="dlgClose" type="button" aria-label="Close">&times;</button></div>
    <div class="mb" id="dlgBody"></div>
  </div>
</div>
<div class="sr" id="sr" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (typeof THREE === "undefined") { document.body.insertAdjacentHTML("beforeend", '<p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center">Three.js could not load. Check your connection and reload.</p>'); return; }

  /* ================= helpers ================= */
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "node"; }
  function titleCase(s) { return String(s).replace(/[-_.]+/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function str(v) { return v == null ? "" : String(v); }
  
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var root = document.documentElement;
  function css(n) { return getComputedStyle(root).getPropertyValue(n).trim(); }
  function announce(t) { $("sr").textContent = ""; setTimeout(function () { $("sr").textContent = t; }, 30); }
  
  
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  

  /* ================= constants ================= */
  var DEFAULT_GROUPS = [
    { id: "clients",   name: "Clients",             color: "#8e9bb3" },
    { id: "edge",      name: "Edge",                color: "#2cc7b8" },
    { id: "services",  name: "Services",            color: "#4f8cff" },

  var TOUR_KEY = "stratum.lite.tour.v2", tour = { el: null, i: 0 };
  var TOUR = [
    { t: "Welcome to Stratum", d: "Explore a system as a 3D map. Drag to orbit, use two fingers to move, pinch to zoom. Tap a component or a connection to see what it does and what it depends on." },
    { sel: "#tTemplates", t: "Start from a template", d: "Web apps, secure networks, remote work, IoT and more. Each one is a common architecture style to explore." },
    { sel: "#cPan", t: "Move the view", d: "Press Move, then drag to slide the whole map around. Press it again to go back to rotating. On a touch screen you can also slide with two fingers." },
    { sel: "#cIn", t: "Zoom in", d: "Press + to move closer to a component and read its name and connections. Pinching or scrolling does the same." },
    { sel: "#cOut", t: "Zoom out", d: "Press − to pull back and see the whole system. Lost? Open More and press Fit to bring everything back into view." },
    { sel: "#tOwn", t: "Your own architecture", d: "Press Your own to load a system you describe. Download the example file, ask any AI assistant (Claude, ChatGPT, Gemini) to write the JSON from your description, then paste or upload it here. The steps are in the window." },
    { sel: "#tMore", t: "More tools", d: "More has the components list, group filters, text size, and this walkthrough." }
  ];
  function tourEnd(done) { if (tour.el) { tour.el.remove(); tour.el = null; } window.removeEventListener("keydown", tourKey, true); window.removeEventListener("resize", tourPlace); if (done !== false) lsSet(TOUR_KEY, "done"); }
  function tourKey(e) { if (e.key === "Escape") { e.stopPropagation(); tourEnd(); } else if (e.key === "ArrowRight") tourGo(1); else if (e.key === "ArrowLeft") tourGo(-1); }
  function tourPlace() {
    if (!tour.el) return;
    var s = TOUR[tour.i], spot = tour.el.querySelector(".tour-spot"), r = null;
    if (s.sel) { var t = document.querySelector(s.sel); if (t) { var b = t.getBoundingClientRect(); if (b.width > 0 && b.height > 0) r = b; } }
    tour.el.style.background = r ? "" : "rgba(8,14,28,0.5)";
    if (r) { spot.style.cssText = "display:block;left:" + (r.left - 6) + "px;top:" + (r.top - 6) + "px;width:" + (r.width + 12) + "px;height:" + (r.height + 12) + "px"; } else spot.style.cssText = "display:none";
  }
  function tourGo(d) {
    if (!tour.el) return; var n = tour.i + d; if (n < 0) return; if (n >= TOUR.length) { tourEnd(); return; }
    tour.i = n; var s = TOUR[n]; tour.el.querySelector("h3").textContent = s.t; tour.el.querySelector("p").textContent = s.d;
    tour.el.querySelector(".tour-step").textContent = (n + 1) + " of " + TOUR.length; tour.el.querySelector(".tour-back").disabled = n === 0; tour.el.querySelector(".tour-next").textContent = n === TOUR.length - 1 ? "Done" : "Next";
    tourPlace(); announce(s.t + ". " + s.d);
  }
  function startTour() {
    tourEnd(false);
    var root = document.createElement("div"); root.className = "tour"; root.setAttribute("role", "dialog"); root.setAttribute("aria-label", "Walkthrough");
    root.innerHTML = '<div class="tour-spot"></div><div class="tour-card"><div class="tour-step"></div><h3></h3><p></p><div class="tour-btns"><button type="button" class="btn tour-skip">Skip</button><span style="flex:1"></span><button type="button" class="btn tour-back">Back</button><button type="button" class="btn primary tour-next">Next</button></div></div>';
    document.body.appendChild(root); tour.el = root; tour.i = 0;
    root.querySelector(".tour-skip").addEventListener("click", function () { tourEnd(); });
    root.querySelector(".tour-back").addEventListener("click", function () { tourGo(-1); });
    root.querySelector(".tour-next").addEventListener("click", function () { tourGo(1); });
    window.addEventListener("keydown", tourKey, true); window.addEventListener("resize", tourPlace);
    tourGo(0); var nx = root.querySelector(".tour-next"); if (nx.focus) nx.focus();
  }
  $("tTour").addEventListener("click", startTour);
  function maybeTour() { if (lsGet(TOUR_KEY) === "done" || location.hash.indexOf("#s=") >= 0 || noGL) return; startTour(); }

  function boot() {
    applyTheme();
    loadTemplate("shop");
    resize(); radius = radiusT;
    if (window.matchMedia) { var mq = window.matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", applyTheme); }

  /* ================= your own architecture (JSON) ================= */
  var EXAMPLE_JSON = {
    name: "Simple web app",
    layout: "flow",
    groups: [{ id: "users", name: "Users" }, { id: "app", name: "Application" }, { id: "data", name: "Data" }],
    nodes: [
      { id: "browser", name: "Browser", type: "client", group: "users", desc: "Where people use the app." },
      { id: "api", name: "API", type: "service", group: "app", stack: "Node.js", owner: "Backend team", desc: "Handles every request from the browser." },
      { id: "cache", name: "Cache", type: "cache", group: "data", stack: "Redis", desc: "Keeps popular answers close by." },
      { id: "db", name: "Database", type: "database", group: "data", stack: "PostgreSQL", owner: "Backend team", desc: "The source of truth." },
      { id: "queue", name: "Job queue", type: "queue", group: "app", desc: "Holds work for later." },
      { id: "worker", name: "Worker", type: "function", group: "app", desc: "Processes jobs in the background." }
    ],
    edges: [
      { from: "browser", to: "api", kind: "sync", label: "HTTPS requests" },
      { from: "api", to: "cache", kind: "soft", label: "reads first" },
      { from: "api", to: "db", kind: "sync", label: "reads and writes" },
      { from: "api", to: "queue", kind: "async", label: "adds jobs" },
      { from: "worker", to: "queue", kind: "async", label: "takes jobs", flip: true },
      { from: "worker", to: "db", kind: "sync", label: "saves results" }
    ]
  };
  function extractJson(text) {
    var t = String(text || "").trim();
    var fence = /```(?:json)?\s*([\s\S]*?)```/i.exec(t); if (fence) t = fence[1].trim();
    var a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a < 0 || b <= a) throw new Error("This does not look like JSON. It should start with { and end with }.");
    return JSON.parse(t.slice(a, b + 1));
  }
  function aiJsonPrompt(description) {
    return [
      "You are helping me make an architecture diagram for a viewer that reads JSON.",
      "",
      "My system: " + (description && description.trim() ? description.trim() : "[describe your system here: what it does and its main parts]"),
      "",
      "I may have attached or pasted an example file (example-architecture.json). Follow its format exactly. If you cannot see it, use this shape.",
      "",
      "Return ONLY one JSON object in a code block, with no other text. Shape:",
      "{",
      '  "name": "short title",',
      '  "layout": "flow",',
      '  "groups": [ { "id": "edge", "name": "Edge" } ],',
      '  "nodes": [ { "id": "api", "name": "API", "type": "service", "group": "edge", "stack": "Node.js", "owner": "Backend team", "desc": "One sentence on what it does." } ],',
      '  "edges": [ { "from": "web", "to": "api", "kind": "sync", "label": "HTTPS requests" } ]',
      "}",
      "",
      "Rules:",
      "- layout must be \"flow\".",
      "- Every node needs a unique lowercase id (letters, numbers, dashes), a name, a type and a group id that exists in groups.",
      "- type must be one of: " + TYPES.join(", ") + ".",
      "- Group nodes by layer or responsibility (for example users, edge, services, data). Use 3 to 8 groups.",
      "- Use 10 to 40 nodes. Do not exceed 150.",
      "- Each edge goes from the component that calls or depends on another to the one it calls. Both ids must exist in nodes.",
      "- kind is one of: sync (a request and a response), async (events or messages, nobody waits), soft (optional, like a cache), alt (a backup path).",
      '- For a consumer that reads from a queue or topic, use from = the consumer, to = the queue, kind async and "flip": true.',
      "- Keep desc to one short sentence. Leave out fields you do not know.",
      "- Output valid JSON: double quotes, no comments, no trailing commas."
    ].join("\n");
  }
  function copyText(text, ta, msg) {
    function fallback() { try { ta.value = text; ta.select(); document.execCommand("copy"); msg.className = "msg good"; msg.textContent = "Copied."; } catch (e) { msg.className = "msg err"; msg.textContent = "Could not copy. Select the text and copy it by hand."; } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { msg.className = "msg good"; msg.textContent = "Copied."; }, fallback); else fallback();
  }
  function ownDialog() {
    openDialog("Your own architecture", function (body) {
      body.appendChild(el("p", "note", "Make your own diagram from a small JSON file. Not sure how to write one? Let an AI assistant do it. Follow the steps in order."));
      body.appendChild(el("div", "lg", "How to get an AI to make the JSON"));
      function step(t) { var p = el("p", "note", t); p.style.marginTop = "10px"; body.appendChild(p); }
      function btns() { var r = el("div", "btnrow"); r.style.marginTop = "6px"; body.appendChild(r); return r; }
      function mk(r, label, primary) { var b = el("button", primary ? "btn primary" : "btn", label); b.type = "button"; r.appendChild(b); return b; }
      function status() { var m = el("p", "msg"); m.setAttribute("role", "status"); body.appendChild(m); return m; }
      step("1. Get the example file. It shows the AI exactly what format to use.");
      var r1 = btns(), ex = mk(r1, "Download example"), exCopy = mk(r1, "Copy example text");
      var emsg = status();
      step("2. Describe your system in a sentence or two: what it does and its main parts.");
      var desc = el("textarea"); desc.placeholder = "Example: an online store with a mobile app, an API, a payments service, a product database and a queue for order emails"; desc.setAttribute("aria-label", "Describe your system"); desc.style.minHeight = "70px"; desc.style.marginTop = "6px"; body.appendChild(desc);
      step("3. Press Copy prompt. Open any AI assistant (Claude, ChatGPT, Gemini), upload the example file from step 1 (or paste the example text), then paste the prompt and send it.");
      var scratch = el("textarea"); scratch.style.cssText = "position:absolute;left:-9999px;top:0;width:1px;height:1px;min-height:0"; scratch.setAttribute("aria-hidden", "true"); scratch.tabIndex = -1; body.appendChild(scratch);
      var r2 = btns(), cp = mk(r2, "Copy prompt", true);
      var pmsg = status();
      step("4. Copy the JSON the AI gives back (only the part from { to }). Paste it into the box below, or save it as a .json file and upload it, then press Load.");
      step("5. If you see an error, paste the error message back to the AI and ask it to fix the JSON.");
      cp.addEventListener("click", function () { copyText(aiJsonPrompt(desc.value), scratch, pmsg); });
      exCopy.addEventListener("click", function () { copyText(JSON.stringify(EXAMPLE_JSON, null, 2), scratch, emsg); });
      ex.addEventListener("click", function () {
        var blob = new Blob([JSON.stringify(EXAMPLE_JSON, null, 2)], { type: "application/json" }), a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = "example-architecture.json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        emsg.className = "msg good"; emsg.textContent = "Downloaded example-architecture.json.";
      });
      body.appendChild(el("div", "lg", "Load your JSON"));
      var ta = el("textarea"); ta.placeholder = "Paste your JSON here"; ta.setAttribute("aria-label", "Architecture JSON"); ta.style.minHeight = "150px"; ta.spellcheck = false; body.appendChild(ta);
      var row2 = el("div", "btnrow"); row2.style.marginTop = "8px";
      var up = el("button", "btn", "Upload .json file"); up.type = "button";
      var go = el("button", "btn primary", "Load"); go.type = "button";
      var fi = document.createElement("input"); fi.type = "file"; fi.accept = ".json,application/json,text/plain"; fi.hidden = true; fi.setAttribute("aria-label", "Choose a JSON file");
      row2.appendChild(up); row2.appendChild(go); body.appendChild(row2); body.appendChild(fi);
      var msg = el("p", "msg"); msg.setAttribute("role", "status"); body.appendChild(msg);
      var notes = el("div"); body.appendChild(notes);
      up.addEventListener("click", function () { fi.click(); });
      fi.addEventListener("change", function () {
        var f = fi.files && fi.files[0]; if (!f) return;
        if (f.size > 500000) { msg.className = "msg err"; msg.textContent = "That file is too large. Keep it under 500 KB."; return; }
        var rd = new FileReader(); rd.onload = function () { ta.value = String(rd.result || ""); msg.className = "msg"; msg.textContent = "File read. Press Load."; }; rd.onerror = function () { msg.className = "msg err"; msg.textContent = "Could not read that file."; }; rd.readAsText(f);
      });
      go.addEventListener("click", function () {
        notes.innerHTML = "";
        try {
          if (ta.value.length > 500000) throw new Error("That is too large. Keep it under 500 KB.");
          var raw = extractJson(ta.value);
          if (!raw || typeof raw !== "object" || !Array.isArray(raw.nodes)) throw new Error('The JSON needs a "nodes" list.');
          var warn = loadModel(raw, { tpl: null }) || [];
          if (!warn.length) { closeDialog(); return; }
          msg.className = "msg good"; msg.textContent = "Loaded " + nodes.length + " components with " + warn.length + " note" + (warn.length === 1 ? "" : "s") + ". Close this window to see the diagram.";
          warn.slice(0, 8).forEach(function (w) { notes.appendChild(el("p", "note", w)); });
        } catch (e) { msg.className = "msg err"; msg.textContent = e && e.message ? e.message : "Could not load that JSON."; }
      });
    });
  }
  $("tOwn").addEventListener("click", ownDialog);

  boot();
})();
